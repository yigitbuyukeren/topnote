name: Geri bildirim / deneme raporu
description: Denedin mi? Ne çalıştı, ne çalışmadı? Kısa bir not yeter.
title: "Geri bildirim: "
labels: [geri-bildirim]
body:
  - type: markdown
    attributes:
      value: "Kullanım deneyimini paylaştığın için teşekkürler. Lütfen kişisel veri, konum, fotoğraf veya sohbet içeriği paylaşma; gerekiyorsa örneği anonimleştir."
  - type: input
    attributes:
      label: "macOS sürümü ve Mac modeli"
      description: "Örn. macOS 15, Apple Silicon"
    validations:
      required: true
  - type: input
    attributes:
      label: "Topnote sürümü"
      description: "Menü çubuğu ikonundan veya sürüm sayfasından"
    validations:
      required: false
  - type: textarea
    attributes:
      label: "Nasıl kullandın?"
      description: "Tam ekran uygulamaların üstünde kaldı mı? ⌃⌥N çakıştı mı? Eksik bulduğun bir şey var mı?"
    validations:
      required: true
  - type: textarea
    attributes:
      label: "Önerin var mı?"
      description: "Hiçbir şey yazmasan da olur."
    validations:
      required: false
